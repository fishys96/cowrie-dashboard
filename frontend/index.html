<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cowrie Attack Dashboard</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <span class="brand">🛰 COWRIE ATTACK DASHBOARD</span>
    <span class="honeypot-label" id="honeypot-label">—</span>
  </div>

  <div class="topbar-search">
    <input type="search" id="search-input" placeholder="Search commands across all attackers…  (e.g. wget, uname)" autocomplete="off" />
  </div>

  <div class="topbar-right">
    <div class="stat">
      <span class="stat-value" id="stat-total">0</span>
      <span class="stat-label">total events</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="stat-per-min">0</span>
      <span class="stat-label">events / min</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="stat-attackers">0</span>
      <span class="stat-label">unique attackers</span>
    </div>
    <div class="ws-status" id="ws-status">
      <span class="ws-dot" id="ws-dot"></span>
      <span id="ws-text">connecting…</span>
    </div>
  </div>
</header>

<!-- Full-viewport hero: the globe is the star on load -->
<section id="hero">
  <div id="globe-container"></div>
  <div class="legend" id="globe-legend"></div>
  <button class="scroll-cue" id="scroll-cue" title="Scroll to analytics">
    <span>ANALYTICS</span>
    <span class="chevron">▼</span>
  </button>
</section>

<!-- Analytics live below the fold -->
<main id="analytics" class="grid">

  <section class="panel panel-feed">
    <div class="panel-header"><h2>Live Event Feed</h2></div>
    <div class="feed-list" id="feed-list"></div>
  </section>

  <section class="panel panel-timeline">
    <div class="panel-header"><h2>Attack Timeline — last 24h</h2></div>
    <div class="chart-wrap"><canvas id="timeline-chart"></canvas></div>
  </section>

  <section class="panel panel-attackers">
    <div class="panel-header">
      <h2>Top Attackers</h2>
      <span class="panel-hint">click to investigate</span>
    </div>
    <div class="attacker-list" id="attacker-list"></div>
  </section>

  <section class="panel panel-credentials">
    <div class="panel-header"><h2>Top Credentials</h2></div>
    <div class="chart-wrap chart-wrap-bar"><canvas id="credentials-chart"></canvas></div>
  </section>

  <section class="panel panel-commands">
    <div class="panel-header"><h2>Command Activity</h2></div>
    <div class="word-cloud" id="command-cloud"></div>
  </section>

  <section class="panel panel-geo">
    <div class="panel-header"><h2>Geo Breakdown</h2></div>
    <div class="geo-list" id="geo-list"></div>
  </section>

</main>

<!-- Slide-in investigation drawer (attacker detail + command search results) -->
<div class="drawer-scrim" id="drawer-scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-header">
    <div class="drawer-title" id="drawer-title">Details</div>
    <button class="drawer-close" id="drawer-close" title="Close">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="/static/app.js"></script>
</body>
</html>
